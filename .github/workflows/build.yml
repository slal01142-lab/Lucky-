name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -d proj; done
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "DIR=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SeaExplorerClicker-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
